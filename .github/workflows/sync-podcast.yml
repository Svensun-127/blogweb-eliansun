name: Sync Podcast

on:
  # 手动触发 — 上传单集后可立刻在 GitHub App 或网页端点 "Run workflow"
  workflow_dispatch:
  # 每周三每小时自动同步一次 (UTC)
  schedule:
    - cron: '0 * * * 3'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run sync script
        run: python scripts/sync_podcast.py

      - name: Commit & push if changed
        run: |
          git config user.name "podcast-bot"
          git config user.email "bot@eliansun.me"

          if git diff --quiet assets/data/podcast.json; then
            echo "No changes — already up to date."
          else
            git add assets/data/podcast.json rss/podcast.xml
            git commit -m "chore(podcast): auto-sync latest episodes"
            git push
            echo "Changes pushed — Render will auto-deploy."
          fi
