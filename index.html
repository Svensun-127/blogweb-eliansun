<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elian</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/about.css">
  <link rel="stylesheet" href="css/thoughts.css">
  <link rel="stylesheet" href="css/search.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body>
  <div id="controls">
    <button id="lang-toggle" aria-label="Switch language" title="Switch Language">E</button>
    <button id="theme-toggle" aria-label="Toggle dark mode" title="Dark/Light Mode">
      <svg id="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <svg id="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>
  </div>

  <main id="app">
    <aside id="sidebar">
      <div id="logo-container">
        <img src="assets/images/avatar.png" alt="Elian pixel-art avatar">
      </div>
      <div id="intro-text">
        <h2 data-i18n="intro">你好，我是Elian</h2>
      </div>
      <div id="about-info">
        <div class="about-item">
          <svg class="icon-line" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
            <line x1="8" y1="14" x2="8" y2="14.01"/>
            <line x1="12" y1="14" x2="12" y2="14.01"/>
            <line x1="8" y1="18" x2="8" y2="18.01"/>
            <line x1="12" y1="18" x2="12" y2="18.01"/>
          </svg>
          <span>2006</span>
        </div>
        <div class="about-item">
          <svg class="icon-line" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <a href="mailto:eliansun7@gmail.com">eliansun7@gmail.com</a>
        </div>
        <div class="about-item about-item-social">
          <a class="social-icon-link" href="https://github.com/Svensun-127" target="_blank" rel="noopener" title="GitHub">
            <svg class="social-icon social-icon-github" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="none">
              <path d="M12 0C5.373 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
            </svg>
          </a>
          <a class="social-icon-link" href="https://x.com/eliansun7" target="_blank" rel="noopener" title="X (Twitter)">
            <svg class="social-icon social-icon-x" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="none">
              <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
          </a>
        </div>
      </div>
    </aside>

    <section id="main-area">
      <div id="hero-banner">
        <div id="hero-overlay">
          <div id="hero-text-wrapper">
            <h1 id="hero-text" data-i18n="hero-text">Mind arises, unattached</h1>
          </div>
        </div>
      </div>

      <nav id="bottom-nav">
        <button data-page="about" class="active" data-i18n="nav-about">About Me</button>
        <button data-page="thoughts" data-i18n="nav-thoughts">Thoughts</button>
      </nav>

      <div id="content-area">
        <section id="page-about" class="page" data-page="about">
          <div class="about-sections">
            <div class="about-section">
              <ul class="about-list">
                <li data-i18n="tag-buddhism">Buddhist 🪷</li>
                <li data-i18n="tag-stock">Option Trader 📈</li>
                <li data-i18n="tag-spurs">Spurs Fan 🏀</li>
                <li data-i18n="tag-dogs">Dog Lover 🐾</li>
                <li data-i18n="tag-sneakers">Sneaker-dog 👟</li>
              </ul>
            </div>
          </div>
        </section>
        <section id="page-thoughts" class="page" data-page="thoughts">
          <!-- 列表视图 -->
          <div class="thoughts-list-view">
            <div class="search-bar">
              <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
              <input type="text" class="search-input" data-i18n-placeholder="search-thoughts" placeholder="" data-i18n="search-thoughts" autocomplete="off">
              <button class="search-clear" aria-label="Clear search" style="display:none">&times;</button>
            </div>
            <div class="thoughts-list"></div>
            <div class="search-no-results" style="display:none" data-i18n="search-no-results">No results found</div>
          </div>
          <!-- 文章详情视图（初始隐藏，JS 动态填充内容） -->
          <div id="thought-detail-view" style="display:none">
            <button id="thought-back-btn" class="thought-back-btn" data-i18n="thought-back">← Back to list</button>
            <article class="thought-detail-article">
              <h3 class="thought-title"></h3>
              <div class="thought-body">
                <pre class="thought-poem"></pre>
                <p class="thought-signature"></p>
              </div>
            </article>
            <p class="thought-end-mark">— END —</p>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/search.js"></script>
  <script src="js/hero.js"></script>
</body>
</html>
